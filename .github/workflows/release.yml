name: Build Musik Release

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  check-version:
    if: "!contains(github.ref, 'refs/tags')"
    runs-on: ubuntu-latest

    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      new_version: ${{ steps.version.outputs.new_version }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Parse Version
        id: version
        shell: bash
        run: |
          set -e

          FILE="app/build.gradle.kts"

          [ -f "$FILE" ] || {
            echo "Missing $FILE"
            exit 1
          }

          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "$FILE")
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' "$FILE")

          [ -n "$VERSION" ] || {
            echo "Failed to parse versionName"
            exit 1
          }

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            FINAL_VERSION="${VERSION}.${{ github.run_number }}"
            IS_PRERELEASE=true
          else
            FINAL_VERSION="$VERSION"
            IS_PRERELEASE=false
          fi

          {
            echo "base_version=$VERSION"
            echo "new_version=$FINAL_VERSION"
            echo "version_code=$VERSION_CODE"
            echo "is_prerelease=$IS_PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: foss
          - variant: gms

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Gradle variant name
        run: |
          flavour=${{ matrix.variant }}
          Flavour=$(echo "$flavour" | sed 's/.*/\u&/')
          echo "variantName=$Flavour" >> $GITHUB_ENV

      - name: Override version name for pre-release
        if: needs.check-version.outputs.is_prerelease == 'true'
        shell: bash
        run: |
          PRE_RELEASE_VERSION="${{ needs.check-version.outputs.new_version }}"
          echo "Overriding versionName to: $PRE_RELEASE_VERSION"
          sed -i "s/versionName = \".*\"/versionName = \"$PRE_RELEASE_VERSION\"/" app/build.gradle.kts

      - name: Build APK
        env:
          METROLIST_APPLICATION_ID: com.metrolist.musik
          METROLIST_APP_NAME: Musik
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          ./gradlew \
            clean \
            assemble${{ env.variantName }}Release \
            :app:lint${{ env.variantName }}Release \
            --console=plain \
            --warning-mode=summary

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: app/build/outputs/apk/${{ matrix.variant }}/release/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Rename APK
        shell: bash
        run: |
          set -e

          OUTPUT_DIR="app/build/outputs/apk/${{ matrix.variant }}/release"
          mkdir -p "$OUTPUT_DIR/out"

          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*versionName *= *"\(.*\)".*/\1/')
          BUILD_TIMESTAMP=$(date +'%d%m%y-%H%M%S')

          find "$OUTPUT_DIR" -type f \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \) | while read -r APK; do
            
            FILE=$(basename "$APK")

            if [[ "$FILE" == *"arm64-v8a"* ]]; then
              ARCH="arm64-v8a"
            elif [[ "$FILE" == *"armeabi-v7a"* ]]; then
              ARCH="armeabi-v7a"
            elif [[ "$FILE" == *"universal"* ]]; then
              ARCH="universal"
            else
              ARCH="unknown"
            fi

            if [ "${{ matrix.variant }}" = "gms" ]; then
              NAME="musik-v${VERSION_NAME}-gms-$ARCH-${BUILD_TIMESTAMP}.apk"
            else
              NAME="musik-v${VERSION_NAME}-foss-$ARCH-${BUILD_TIMESTAMP}.apk"
            fi

            cp "$APK" "$OUTPUT_DIR/out/$NAME"

            echo "Created $NAME"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}
          path: app/build/outputs/apk/${{ matrix.variant }}/release/out/*.apk

  create-release:
    needs:
      - check-version
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: release_files
          merge-multiple: true

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ needs.check-version.outputs.new_version }}"
          CURRENT_TAG="v${VERSION}"

          LATEST_RELEASE=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")

          SKIP_PATTERNS="bump.*v"

          if [ -z "$LATEST_RELEASE" ]; then
            {
              echo "# Initial Release: Musik v${VERSION}"
              echo ""
              echo "Welcome to the first release of Musik!"
              echo ""
              git log --pretty=format:"- %s" --no-merges | head -50 | grep -vi "$SKIP_PATTERNS" || true
              echo ""
              echo "[View full changelog](https://github.com/${{ github.repository }}/commits/$CURRENT_TAG)"
            } > release_notes.md
          elif [ "$LATEST_RELEASE" = "$CURRENT_TAG" ]; then
            echo "# Re-release: Musik v${VERSION}" > release_notes.md
            echo "" >> release_notes.md
            echo "This is a re-release of v${VERSION} with the same codebase." >> release_notes.md
          else
            {
              echo "# Musik v${VERSION}"
              echo ""
              echo "## Changes since \`$LATEST_RELEASE\`"
              echo ""
              git log "$LATEST_RELEASE..HEAD" --pretty=format:"- %s" --no-merges | grep -vi "$SKIP_PATTERNS" || echo "- No user-facing changes"
              echo ""
              echo "---"
            } > release_notes.md
          fi

          echo "Release notes generated for: $CURRENT_TAG"
          echo "Based on previous: ${LATEST_RELEASE:-none (first release)}"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -e

          VERSION="${{ needs.check-version.outputs.new_version }}"
          IS_PRE="${{ needs.check-version.outputs.is_prerelease }}"

          APKS=$(find release_files -name "*.apk")

          [ -n "$APKS" ] || {
            echo "No APKs found"
            exit 1
          }

          if [ "$IS_PRE" = "true" ]; then
            gh release create "v$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md \
              --prerelease \
              $APKS
          else
            gh release create "v$VERSION" \
              --title "$VERSION" \
              --notes-file release_notes.md \
              --latest \
              $APKS
          fi

      - name: Release Summary
        shell: bash
        run: |
          {
            echo "## Release Summary"
            echo "- Version: v${{ needs.check-version.outputs.new_version }}"
            echo "- Version Code: ${{ needs.check-version.outputs.version_code }}"
            echo "- APK Count: $(find release_files -name '*.apk' | wc -l)"
            echo "- Release URL: https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-version.outputs.new_version }}"
          } >> "$GITHUB_STEP_SUMMARY"
